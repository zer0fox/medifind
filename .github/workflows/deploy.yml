name: Deploy React App to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your main branch is called master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6 # Updated to v6 (Node 24 native)

      - name: Setup Node.js
        uses: actions/setup-node@v6 # Updated to v6 (Node 24 native)
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Upload Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Use './build' if using Create React App instead of Vite

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
